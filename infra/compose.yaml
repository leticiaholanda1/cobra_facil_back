services:
  postgres:
    image: postgres:17
    container_name: cobra_facil_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cobra_facil
      POSTGRES_USER: cobra_facil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobra_facil -d cobra_facil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
